    <!-- Decide before first paint whether the swarm intro plays, so the
         prerendered page never flashes before going blank. -->
    <script>
      (function () {
        var mode = 'off'
        try {
          var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches
          var played = null
          try { played = sessionStorage.getItem('swarm:played') } catch (e) {}
          if (!reduce && !played) mode = 'play'
        } catch (e) {}
        document.documentElement.setAttribute('data-swarm', mode)
        // Safety net: if the app never boots, show the finished page.
        if (mode === 'play') {
          setTimeout(function () {
            if (!window.__swarmBooted) document.documentElement.setAttribute('data-swarm', 'off')
          }, 6000)
        }
      })()
    </script>
